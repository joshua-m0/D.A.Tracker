<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Activity Tracker</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f5a623">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tracker">
  <link rel="apple-touch-icon" href="icon-192.svg">
</head>
<body>
  <main class="app">

    <header class="tracker-header">
      <div class="header-left">
        <p class="eyebrow">Today</p>
        <h1>Daily Activities</h1>
      </div>
      <div class="header-actions">
        <div class="live-clock" id="liveClock">--:--:--</div>
        <a href="records.html" class="records-link">
          Records
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </a>
        <button class="reset-button" type="button" id="resetButton">Reset</button>
      </div>
    </header>

    <!-- Donut + progress -->
    <div class="progress-row">
      <div class="donut-wrap">
        <canvas id="donutCanvas" width="100" height="100"></canvas>
      </div>
      <div class="progress-info">
        <p class="progress-label" id="progressText">0/0 activities completed</p>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>
    </div>

    <!-- Form -->
    <form class="activity-form" id="activityForm">
      <div class="form-row-top">
        <div class="form-field form-field--grow">
          <label for="activityName">Activity</label>
          <input type="text" id="activityName" placeholder="e.g. Morning run" required>
        </div>
        <div class="form-field">
          <label for="activityCategory">Category</label>
          <select id="activityCategory">
            <option value="health">Health</option>
            <option value="work">Work</option>
            <option value="personal">Personal</option>
            <option value="social">Social</option>
            <option value="other" selected>Other</option>
          </select>
        </div>
      </div>
      <div class="form-row-bottom">
        <div class="form-field">
          <label for="activityStartTime">Start time</label>
          <input type="time" id="activityStartTime" required>
        </div>
        <div class="form-field">
          <label for="activityDuration">Duration (min)</label>
          <input type="number" id="activityDuration" min="1" step="1" placeholder="60" required>
        </div>
        <div class="form-field form-field--grow">
          <label for="activityNotes">Notes (optional)</label>
          <input type="text" id="activityNotes" placeholder="Any notes...">
        </div>
      </div>
      <button class="add-button" type="submit">Add Activity</button>
    </form>

    <p class="empty-message" id="emptyMessage">No activities yet. Add one above.</p>
    <ul class="task-list" id="taskList"></ul>

  </main>
  <script src="script.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js')
          .then(function(reg) { console.log('SW registered:', reg.scope); })
          .catch(function(err) { console.log('SW error:', err); });
      });
    }
  </script>
</body>
</html>
